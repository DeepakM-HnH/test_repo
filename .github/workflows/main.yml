name: Test PowerShell Connection

on:
  push:
    branches:
      - main

jobs:
  test-connection:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run PowerShell Command
        shell: pwsh
        run: |
          Write-Output "Testing remote connection..."

          # Hardcoded credentials (ONLY FOR TESTING)
          $username = "hhadmin"
          $password = ConvertTo-SecureString "P@ssw0rd" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential ($username, $password)

          # Allow Basic Authentication if necessary
          Set-Item WSMan:\localhost\Service\Auth\Basic -Value $true -Force
          
          # Attempt connection with Basic Authentication
          try {
            $session = New-PSSession -ComputerName "edgeappbk" -Credential $credential -Authentication Basic
            if ($session) { Write-Output "Connected Successfully!" }
          } catch {
            Write-Output "Connection Failed! Error: $_"
          }
